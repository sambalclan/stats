name: Update Clan Data (Daily)

on:
  schedule:
    - cron: '0 9 * * *' # Jalan sekali sehari jam 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-clan
  cancel-in-progress: false

jobs:
  update-clan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests python-dotenv

      - name: Run Clan Scraper
        env:
          COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
          CLAN_TAG: ${{ secrets.CLAN_TAG }}
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/scrapers
          python scrapers/clan_scraper.py

      - name: Commit and Push
        run: |
          git config user.name "Stats Bot"
          git config user.email "bot@github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data, lewati commit."
            exit 0
          fi

          git commit -m "Auto-update clan members"

          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Push gagal (percobaan $i), coba lagi..."
            sleep 5
          done

          echo "Push gagal setelah 3 percobaan."
          exit 1