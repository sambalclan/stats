name: Fetch CoC 

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
     - name: Checkout Repo
        uses: actions/checkout@v3

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install requests

      - name: looking for coc api
        env:
          COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
          COC_BASE_URL: https://cocproxy.royaleapi.dev/v1
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/py
          python py/main.py
          
      - name: Commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data || true
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan data."
            exit 0
          fi
          git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase
          git push
