<!DOCTYPE html>
<html lang="id" class="bg-[#121212] min-h-screen text-slate-100">
<head>
    <meta charset="UTF-8">
    <!-- Viewport agar responsif di berbagai DPI dan ukuran layar -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Sambal Balado Clan</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600&family=Fruktur&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="pages/style.css">
</head>

<body class="bg-[#121212] text-white min-h-screen flex flex-col justify-between antialiased selection:bg-purple-600 selection:text-white">

    <!-- Main Content Container dengan batas lebar dan padding fleksibel -->
    <main class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-4 pb-28 flex-1">

        <!-- About Section -->
        <section id="section-about" class="w-full">
            <div id="aboutContent"></div>
        </section>

        <!-- Members Section -->
        <section id="section-members" class="w-full hidden-section">
            <div id="membersContent"></div>
        </section>

        <!-- Competitive / War Section -->
        <section id="section-war" class="w-full hidden-section" style="display: none;">
            <div id="warContent" class="p-3 md:p-5 w-full max-w-xl mx-auto">
                <h2 class="text-lg font-bold text-white mb-3">Competitive / War History</h2>
                <div id="warDataContainer" class="text-gray-300 text-sm">Memuat data war...</div>
            </div>
        </section>

    </main>

    <!-- Bottom Navigation -->
    <nav id="bottomToolbar" aria-label="Main Navigation">
        <button id="tab-about" class="active">
            <span>Dashboard</span>
        </button>
        <button id="tab-members">
            <span>Members</span>
        </button>
        <button id="tab-war">
            <span>Competitive</span>
        </button>
    </nav>

    <!-- Main JavaScript -->
    <script type="module" src="js/app.js"></script>

</body>
</html>
