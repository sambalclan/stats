<!DOCTYPE html>
<html lang="en" class="bg-[#121212]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sambal Balado Clan</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Fruktur" rel="stylesheet">

    <link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="pages/style.css">
</head>

<body>

    <!-- Navigation -->
<div id="bottomToolbar">
    <button id="tab-about" class="active">
        <span>Dashboard</span>
    </button>
    <button id="tab-members">
        <span>Members</span>
    </button>
    <button id="tab-war">
        <span>Competitive</span>
    </button>
    </div>

<!-- Main Content -->
<main class="w-full">

    <!-- About Section -->
    <section id="section-about" class="lg:col-span-12">
        <div id="aboutContent"></div>
    </section>

    <!-- Members Section -->
    <section id="section-members" class="lg:col-span-12 hidden-section">
        <div id="membersContent"></div>
    </section>

    <!-- Competitive / War Section -->
    <section id="section-war" class="lg:col-span-12 hidden-section" style="display: none;">
        <div id="warContent" class="p-3 md:p-5 pb-28 w-full max-w-xl mx-auto">
            <h2 class="text-lg font-bold text-white mb-3">Competitive / War History</h2>
            <div id="warDataContainer" class="text-gray-300 text-sm">Memuat data war...</div>
        </div>
    </section>

</main>


    <!-- Main JavaScript -->
    <script type="module" src="js01/app.js"></script>

</body>
</html>
